name: feed

# PRs: lint, test, build and scan. main: also push a signed image to GHCR and point both
# environments at it by committing the new tag to platform/envs/*/feed.yaml; Argo CD does the rest
# (ADR-0005).

on:
  pull_request:
    paths:
      - "apps/feed/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/feed.yml"
  push:
    branches: [main]
    paths:
      - "apps/feed/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/feed.yml"

permissions:
  contents: read

concurrency:
  group: feed-${{ github.ref }}
  # Never cancel a run on main halfway through a push or a deploy commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/resonance-feed

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # Same uv as apps/feed/Dockerfile.
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: make lint
      - run: make test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing through the workflow's OIDC identity.
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # Load a local copy first: attestations cannot be loaded into the Docker daemon, and the
      # scan has to pass before anything is pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/feed/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=feed
          cache-to: type=gha,scope=feed,mode=max
      # Pinned by commit: trivy-action tags were hijacked in a 2026 supply-chain attack.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Same build again, served from the cache, now with SBOM and provenance attestations.
      - if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/feed/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=feed
      - if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v4.1.2
      - if: github.event_name == 'push'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: feed-deploy
      cancel-in-progress: false
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      # Commits pushed with the workflow token do not start other workflows, so this cannot loop.
      - name: point environments at ${{ env.TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            for file in platform/envs/*/feed.yaml; do
              current=$(yq '.image.tag' "$file")
              # A slower run for an older commit must not roll back a newer deploy.
              if [[ $current == sha-* ]] && [[ $current != "$TAG" ]] &&
                git merge-base --is-ancestor "$GITHUB_SHA" "${current#sha-}" 2>/dev/null; then
                echo "$file already runs $current, which is newer than $TAG"
                continue
              fi
              yq -i ".image.tag = \"$TAG\"" "$file"
            done
            if git diff --quiet; then
              echo "Nothing to change."
              exit 0
            fi
            git commit -am "chore(deploy): feed $TAG"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
