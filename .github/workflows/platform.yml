name: platform

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      # Helm lint, then every rendered manifest (charts, app of apps, observability kustomization,
      # root apps) against Kubernetes and Argo CD schemas.
      - run: make platform-lint
