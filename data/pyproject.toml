[project]
name = "resonance-data"
version = "0.1.0"
description = "Resonance data platform: bronze/silver ingestion with Spark and Delta, gold marts with dbt"
requires-python = ">=3.12"
dependencies = [
  "pyspark>=4.2,<4.3",
  "delta-spark>=4.4,<4.5",
  "dbt-core>=1.12,<1.13",
  "dbt-spark[session]>=1.11,<1.12",
  "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_data"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long column lists read better as space-separated words than as 40-element list literals.
"src/resonance_data/fma/sample.py" = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["resonance_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lake: needs the local lake (S3_ENDPOINT set); `make lake-up`"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "delta"]
ignore_missing_imports = true
