# Root of the dev environment on EKS. Applied once per `make cloud-up` by
# `make gitops-up K8S_ENV=dev`; Argo CD then renders platform/argocd/apps with apps.yaml and keeps
# every child in sync with Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ovahabpo239/MRS_project.git
    targetRevision: main
    path: platform/argocd/apps
    helm:
      valueFiles:
        - ../../envs/dev/apps.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
